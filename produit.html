<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Fiche produit — watchmods.ch</title>
<meta name="description" content="Détail d'une montre Seiko modifiée watchmods.ch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAFA;
    --bg-panel: #FFFFFF;
    --bg-panel-2: #F1F2F4;
    --accent: #E0263E;
    --accent-dim: #B01F32;
    --warning: #C2600F;
    --text: #15171A;
    --muted: #6B7078;
    --line: #E4E5E9;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  a { color: inherit; }

  .wrap {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 28px;
  }

  .mono {
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
  }

  /* ---------- Header ---------- */

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(250, 250, 250, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }

  header .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
  }

  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-decoration: none;
  }

  .logo span { color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 28px; }

  nav { display: flex; gap: 32px; }

  nav a {
    position: relative;
    text-decoration: none;
    color: var(--muted);
    font-size: 0.9rem;
    transition: color 0.2s ease;
  }

  nav a::after {
    content: '';
    position: absolute;
    left: 0;
    right: 100%;
    bottom: -4px;
    height: 1px;
    background: var(--accent);
    transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  nav a:hover, nav a.active { color: var(--text); }
  nav a:hover::after, nav a.active::after { right: 0; }

  header { transition: box-shadow 0.3s ease; }
  header.scrolled { box-shadow: 0 12px 28px -20px rgba(0, 0, 0, 0.7); }

  @media (prefers-reduced-motion: no-preference) {
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      animation: prodFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes prodFadeUp { to { opacity: 1; transform: none; } }
  }

  .btn { transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, background 0.2s ease; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 24px -10px rgba(224, 38, 62, 0.35); }
  .btn-primary:active:not(:disabled) { transform: translateY(0) scale(0.97); }

  @media (prefers-reduced-motion: no-preference) {
    .pop-in { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes popIn { from { opacity: 0.6; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  }

  .cart-link {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--text);
    font-size: 0.9rem;
  }

  .cart-badge {
    display: none;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
  }

  /* ---------- Breadcrumb ---------- */

  .breadcrumb {
    padding: 24px 0;
    font-size: 0.82rem;
    color: var(--muted);
  }

  .breadcrumb a { text-decoration: none; }
  .breadcrumb a:hover { color: var(--text); }

  /* ---------- Product ---------- */

  .product {
    padding: 20px 0 90px;
  }

  .product-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 64px;
    align-items: start;
  }

  .gallery-main {
    width: 100%;
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle at 32% 28%, #2a2f38, #14171c 70%);
    border: 1px solid var(--line);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .gallery-main:hover { transform: scale(1.03); }
  .gallery-main:hover .hand:nth-of-type(1) { transform: translateX(-50%) rotate(45deg); }

  .gallery-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .gallery-main::before {
    content: '';
    position: absolute;
    inset: 10%;
    border-radius: 50%;
    border: 1px solid var(--accent-dim);
    opacity: 0.5;
    pointer-events: none;
  }

  .gallery-main .hand {
    position: absolute;
    width: 3px;
    background: var(--accent);
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 3px;
    transition: transform 0.6s ease;
  }

  .gallery-main .hand:nth-of-type(1) { height: 27%; transform: translateX(-50%) rotate(35deg); }
  .gallery-main .hand:nth-of-type(2) { height: 34%; width: 2px; transform: translateX(-50%) rotate(150deg); }

  .gallery-thumbs {
    display: flex;
    gap: 12px;
    margin-top: 20px;
  }

  .gallery-thumbs .thumb {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--bg-panel);
    border: 1px solid var(--line);
  }

  .info-collection {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.78rem;
    color: var(--accent);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .info-collection::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px var(--accent);
  }

  .product h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: clamp(1.8rem, 4vw, 2.6rem);
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }

  .info-ref {
    color: var(--muted);
    font-size: 0.85rem;
    margin-bottom: 24px;
  }

  .info-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.6rem;
    color: var(--accent);
    margin-bottom: 20px;
  }

  .stock-line {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.85rem;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--line);
    margin-bottom: 28px;
  }

  .stock-line.ok { color: #1E7D4A; border-color: #CFE9DA; }
  .stock-line.rupture { color: var(--warning); border-color: #F0D9C2; }

  .info-desc {
    color: var(--muted);
    font-size: 1rem;
    margin-bottom: 32px;
    max-width: 480px;
  }

  .spec-card {
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 22px 24px;
    margin-bottom: 32px;
  }

  .spec-row {
    display: flex;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    font-size: 0.92rem;
  }

  .spec-row:last-child { border-bottom: none; }
  .spec-row .label { color: var(--muted); }
  .spec-row .value {
    font-family: 'JetBrains Mono', monospace;
    color: var(--text);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 28px;
    border-radius: 3px;
    font-size: 0.95rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    width: 100%;
    max-width: 360px;
  }

  .btn-primary {
    background: var(--accent);
    color: #FFFFFF;
  }

  .btn-primary:hover { background: var(--accent-dim); }

  .btn-primary:disabled {
    background: var(--line);
    color: var(--muted);
    cursor: not-allowed;
  }

  .buy-note {
    margin-top: 12px;
    font-size: 0.78rem;
    color: var(--muted);
    max-width: 360px;
  }

  .qty-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }

  .qty-row label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .qty-row input {
    width: 70px;
    background: var(--bg-panel);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
  }

  .qty-row input:focus { outline: none; border-color: var(--accent); }

  .not-found {
    padding: 100px 0;
    text-align: center;
  }

  .not-found h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 1.8rem;
    margin-bottom: 14px;
  }

  .not-found p { color: var(--muted); margin-bottom: 24px; }

  /* ---------- Footer ---------- */

  footer {
    border-top: 1px solid var(--line);
    padding: 36px 0;
  }

  footer .wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    color: var(--muted);
  }

  /* ---------- Responsive ---------- */

  @media (max-width: 860px) {
    nav { display: none; }
    .product-grid { grid-template-columns: 1fr; gap: 36px; }
    .gallery-main { max-width: 340px; margin: 0 auto; }
    .gallery-thumbs { justify-content: center; }
    .btn, .buy-note { max-width: none; }
  }
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="index.html" class="logo">watch<span>mods</span>.ch</a>
    <div class="header-right">
      <nav>
        <a href="index.html">Accueil</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="configurateur.html">Configurateur</a>
        <a href="index.html#waitlist">Contact</a>
      </nav>
      <a href="panier.html" class="cart-link">Panier <span class="cart-badge" id="cart-badge">0</span></a>
    </div>
  </div>
</header>

<div class="wrap breadcrumb">
  <a href="index.html">Accueil</a> / <a href="catalogue.html">Catalogue</a> / <span id="breadcrumb-nom">…</span>
</div>

<section class="product">
  <div class="wrap" id="product-content"></div>
</section>

<footer>
  <div class="wrap">
    <span>© 2026 watchmods.ch</span>
    <span>Genève, Suisse</span>
  </div>
</footer>

<script>
  // Données statiques temporaires — seront remplacées par une lecture Supabase (table "produits").
  const produits = [
    { reference: 'WM-001', nom: 'Midnight Fifty-Five', collection: 'Diver', prix: 249, stock: 4, photos: [],
      description: "Chaque Midnight Fifty-Five part d'un mouvement Seiko NH35 authentique. Cadran noir sunburst, aiguilles luminova, boîtier 40mm en acier 316L et verre saphir bombé. Contrôlée à la main avant expédition.",
      boitier: "40mm · acier 316L", etancheite: "100m", verre: "Saphir bombé" },
    { reference: 'WM-002', nom: 'Verdant Diver', collection: 'Diver', prix: 279, stock: 0, photos: [],
      description: "Lunette vert forêt sur base Seiko NH35, aiguilles luminova haute intensité, étanchéité 100m. Un diver au caractère affirmé.",
      boitier: "41mm · acier 316L", etancheite: "100m", verre: "Saphir plat" },
    { reference: 'WM-003', nom: 'Brass Explorer', collection: 'Explorer', prix: 289, stock: 6, photos: [],
      description: "Aiguilles en laiton vieilli, cadran champagne, verre saphir bombé. Un hommage moderne aux montres d'exploration.",
      boitier: "39mm · acier 316L", etancheite: "50m", verre: "Saphir bombé" },
    { reference: 'WM-004', nom: 'Slate Fieldwatch', collection: 'Field', prix: 229, stock: 8, photos: [],
      description: "Cadran ardoise mat, index façon militaire, bracelet toile. Robuste et lisible en toute condition.",
      boitier: "38mm · acier brossé", etancheite: "50m", verre: "Minéral traité" },
    { reference: 'WM-005', nom: 'Copper Alpinist', collection: 'Explorer', prix: 299, stock: 2, photos: [],
      description: "Boîtier cuivré brossé, lunette compas, aiguilles cathédrale. Une pièce d'inspiration alpine, en série limitée.",
      boitier: "39.5mm · acier plaqué cuivre", etancheite: "100m", verre: "Saphir bombé" },
    { reference: 'WM-006', nom: 'Noir Dress', collection: 'Dress', prix: 259, stock: 5, photos: [],
      description: "Cadran laqué noir, boîtier fin de 38mm, allure habillée. Pensée pour accompagner un costume comme une chemise décontractée.",
      boitier: "38mm · acier poli", etancheite: "30m", verre: "Saphir plat" }
  ];

  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  const produit = produits.find(p => p.reference === ref);

  const content = document.getElementById('product-content');
  const breadcrumbNom = document.getElementById('breadcrumb-nom');

  if (!produit) {
    breadcrumbNom.textContent = 'Introuvable';
    content.innerHTML = `
      <div class="not-found">
        <h1>Montre introuvable</h1>
        <p>Ce modèle n'existe pas ou n'est plus disponible.</p>
        <a href="catalogue.html" class="btn btn-primary" style="display:inline-flex;width:auto;">Retour au catalogue</a>
      </div>
    `;
  } else {
    document.title = produit.nom + ' — watchmods.ch';
    breadcrumbNom.textContent = produit.nom;

    const enStock = produit.stock > 0;
    const gallery = produit.photos && produit.photos.length
      ? `<div class="gallery-main"><img src="${produit.photos[0]}" alt="${produit.nom}"></div>`
      : `<div class="gallery-main"><div class="hand"></div><div class="hand"></div></div>`;

    content.innerHTML = `
      <div class="product-grid reveal">
        <div>
          ${gallery}
        </div>
        <div>
          <div class="info-collection">${produit.collection}</div>
          <h1>${produit.nom}</h1>
          <div class="info-ref mono">Référence ${produit.reference}</div>
          <div class="info-price">CHF ${produit.prix}</div>
          <div class="stock-line ${enStock ? 'ok' : 'rupture'}">${enStock ? `En stock — ${produit.stock} disponible(s)` : 'Rupture de stock'}</div>
          <p class="info-desc">${produit.description}</p>
          <div class="spec-card">
            <div class="spec-row"><span class="label">Boîtier</span><span class="value">${produit.boitier}</span></div>
            <div class="spec-row"><span class="label">Étanchéité</span><span class="value">${produit.etancheite}</span></div>
            <div class="spec-row"><span class="label">Verre</span><span class="value">${produit.verre}</span></div>
            <div class="spec-row"><span class="label">Contrôle qualité</span><span class="value">Manuel</span></div>
          </div>
          ${enStock ? `
          <div class="qty-row">
            <label for="qty-input" class="mono">Quantité</label>
            <input type="number" id="qty-input" min="1" max="${produit.stock}" value="1">
          </div>
          ` : ''}
          <button class="btn btn-primary" id="add-cart-btn" ${enStock ? '' : 'disabled'}>
            ${enStock ? 'Ajouter au panier' : 'Rupture de stock'}
          </button>
          <div class="buy-note" id="add-confirm" style="display:none;">Ajouté au panier ✓ — <a href="panier.html" style="color:var(--accent);">voir mon panier</a></div>
          <div class="buy-note" id="buy-note-default">Paiement sécurisé par Stripe, expédition rapide.</div>
        </div>
      </div>
    `;

    const addCartBtn = document.getElementById('add-cart-btn');
    if (addCartBtn && enStock) {
      addCartBtn.addEventListener('click', () => {
        const qtyInput = document.getElementById('qty-input');
        const quantiteVoulue = Math.max(1, Math.min(produit.stock, parseInt(qtyInput.value, 10) || 1));

        let cart = [];
        try { cart = JSON.parse(localStorage.getItem('watchmods_cart') || '[]'); } catch (e) {}

        const existant = cart.find(item => item.reference === produit.reference);
        if (existant) {
          existant.quantite = Math.min(produit.stock, existant.quantite + quantiteVoulue);
        } else {
          cart.push({ reference: produit.reference, nom: produit.nom, prix: produit.prix, quantite: quantiteVoulue });
        }
        localStorage.setItem('watchmods_cart', JSON.stringify(cart));
        window.dispatchEvent(new Event('storage'));

        var confirmEl = document.getElementById('add-confirm');
        confirmEl.style.display = 'block';
        confirmEl.classList.add('pop-in');
        document.getElementById('buy-note-default').style.display = 'none';
        addCartBtn.classList.add('pop-in');
        addCartBtn.addEventListener('animationend', function () { addCartBtn.classList.remove('pop-in'); }, { once: true });
      });
    }
  }

  (function () {
    var badge = document.getElementById('cart-badge');
    function updateCartBadge() {
      var cart = [];
      try { cart = JSON.parse(localStorage.getItem('watchmods_cart') || '[]'); } catch (e) {}
      var count = cart.reduce(function (sum, item) { return sum + (item.quantite || 1); }, 0);
      if (!badge) return;
      badge.textContent = count;
      badge.style.display = count > 0 ? 'inline-flex' : 'none';
    }
    updateCartBadge();
    window.addEventListener('storage', updateCartBadge);
  })();

  (function () {
    var header = document.querySelector('header');
    function onScroll() { if (header) header.classList.toggle('scrolled', window.scrollY > 8); }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  })();
</script>

</body>
</html>
