<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Fiche produit — watchmods.ch</title>
<meta name="description" content="Détail d'une montre Seiko modifiée watchmods.ch.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FAFAFA;
    --bg-panel: #FFFFFF;
    --bg-panel-2: #F1F2F4;
    --accent: #E0263E;
    --accent-dim: #B01F32;
    --warning: #C2600F;
    --text: #15171A;
    --muted: #6B7078;
    --line: #E4E5E9;
    --ink: #F2F0EC;
    --ink-muted: rgba(242, 240, 236, 0.64);
    --ink-line: rgba(255, 255, 255, 0.12);
    --ember: #C9622F;
    --ember-dim: #A84C22;
    --ember-glow: rgba(201, 98, 47, 0.28);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    background: #17140f;
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  a { color: inherit; }

  .wrap {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 28px;
  }

  .mono {
    font-family: 'JetBrains Mono', monospace;
    letter-spacing: 0.02em;
  }

  /* ---------- Atelier background ---------- */

  .atelier-bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-color: #17140f;
    background-image: url('assets/intro-atelier.jpg');
    background-image: image-set(url('assets/intro-atelier.webp') 1x);
    background-size: cover;
    background-position: center 35%;
    filter: blur(16px) brightness(0.56) saturate(1.1);
    transform: scale(1.12);
  }

  .atelier-bg::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 38%, rgba(23,20,15,0.1), rgba(15,13,10,0.58) 100%);
  }

  /* ---------- Header ---------- */

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(23, 20, 15, 0.6);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--ink-line);
  }

  header .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 72px;
  }

  .logo {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.25rem;
    font-weight: 600;
    letter-spacing: -0.01em;
    text-decoration: none;
    color: var(--ink);
  }

  .logo span { color: var(--accent); }

  .header-right { display: flex; align-items: center; gap: 28px; }

  nav { display: flex; gap: 32px; }

  nav a {
    position: relative;
    text-decoration: none;
    color: var(--ink-muted);
    font-size: 0.9rem;
    transition: color 0.2s ease;
  }

  nav a::after {
    content: '';
    position: absolute;
    left: 0;
    right: 100%;
    bottom: -4px;
    height: 1px;
    background: var(--accent);
    transition: right 0.35s cubic-bezier(0.16, 1, 0.3, 1);
  }

  nav a:hover, nav a.active { color: var(--ink); }
  nav a:hover::after, nav a.active::after { right: 0; }

  header { transition: box-shadow 0.3s ease; }
  header.scrolled { box-shadow: 0 12px 28px -20px rgba(0, 0, 0, 0.7); }

  @media (prefers-reduced-motion: no-preference) {
    .reveal {
      opacity: 0;
      transform: translateY(24px);
      animation: prodFadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes prodFadeUp { to { opacity: 1; transform: none; } }
  }

  .btn { transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.25s ease, background 0.2s ease; }
  .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 10px 24px -10px rgba(201, 98, 47, 0.5); }
  .btn-primary:active:not(:disabled) { transform: translateY(0) scale(0.97); }

  @media (prefers-reduced-motion: no-preference) {
    .pop-in { animation: popIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes popIn { from { opacity: 0.6; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
  }

  .cart-link {
    display: flex;
    align-items: center;
    gap: 8px;
    text-decoration: none;
    color: var(--ink);
    font-size: 0.9rem;
  }

  .cart-badge {
    display: none;
    align-items: center;
    justify-content: center;
    min-width: 20px;
    height: 20px;
    padding: 0 6px;
    border-radius: 999px;
    background: var(--accent);
    color: #FFFFFF;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    font-weight: 500;
  }

  /* ---------- Breadcrumb ---------- */

  .breadcrumb {
    padding: 22px 0 0;
    font-size: 0.82rem;
    color: var(--ink-muted);
  }

  .breadcrumb a { text-decoration: none; }
  .breadcrumb a:hover { color: var(--ink); }

  /* ---------- Product stage ---------- */

  .product {
    padding: 24px 0 80px;
    min-height: calc(100vh - 130px);
    display: flex;
    align-items: center;
  }

  .product-stage {
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
  }

  .stage-visual {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 460px;
    width: 100%;
    padding-right: 400px;
    perspective: 1600px;
  }

  .stage-visual-glow {
    position: absolute;
    width: 60%;
    aspect-ratio: 1;
    background: radial-gradient(circle, var(--ember-glow), transparent 72%);
    filter: blur(55px);
    pointer-events: none;
  }

  .gallery-main {
    width: min(520px, 86%);
    aspect-ratio: 1;
    border-radius: 50%;
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: visible;
    transform: rotateX(8deg) rotateY(-14deg);
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }

  .gallery-main:hover .hand:nth-of-type(1) { transform: translateX(-50%) rotate(45deg); }

  .gallery-main img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    border-radius: 50%;
    mask-image: radial-gradient(circle at 50% 50%, #000 70%, transparent 96%);
    -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 70%, transparent 96%);
    filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.35));
  }

  .gallery-main .hand {
    position: absolute;
    width: 3px;
    background: var(--ember);
    bottom: 50%;
    left: 50%;
    transform-origin: bottom center;
    border-radius: 3px;
    transition: transform 0.6s ease;
  }

  .gallery-main .hand:nth-of-type(1) { height: 27%; transform: translateX(-50%) rotate(35deg); }
  .gallery-main .hand:nth-of-type(2) { height: 34%; width: 2px; transform: translateX(-50%) rotate(150deg); }

  /* ---------- Info panel (overlay style, floating) ---------- */

  .info-panel {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 360px;
    background: rgba(23, 20, 17, 0.6);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--ink-line);
    border-radius: 14px;
    padding: 28px 28px 30px;
    z-index: 2;
  }

  .info-collection {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.76rem;
    color: var(--ember);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .info-collection::before {
    content: '';
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ember);
    box-shadow: 0 0 8px var(--ember);
  }

  .product h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: clamp(1.5rem, 2.6vw, 2rem);
    letter-spacing: -0.02em;
    margin-bottom: 8px;
    color: var(--ink);
  }

  .info-ref {
    color: var(--ink-muted);
    font-size: 0.8rem;
    margin-bottom: 18px;
  }

  .info-price {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1.4rem;
    color: var(--ember);
    margin-bottom: 16px;
  }

  .stock-line {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-size: 0.82rem;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--ink-line);
    margin-bottom: 22px;
    color: var(--ink-muted);
  }

  .stock-line.ok { color: #6fd99a; border-color: rgba(111, 217, 154, 0.3); }
  .stock-line.rupture { color: #e8a15c; border-color: rgba(232, 161, 92, 0.3); }

  .info-desc {
    color: var(--ink-muted);
    font-size: 0.92rem;
    margin-bottom: 26px;
  }

  .spec-card {
    border-top: 1px solid var(--ink-line);
    border-bottom: 1px solid var(--ink-line);
    padding: 6px 0;
    margin-bottom: 26px;
  }

  .spec-row {
    display: flex;
    justify-content: space-between;
    padding: 11px 0;
    border-bottom: 1px solid var(--ink-line);
    font-size: 0.86rem;
  }

  .spec-row:last-child { border-bottom: none; }
  .spec-row .label { color: var(--ink-muted); }
  .spec-row .value {
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink);
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 15px 28px;
    border-radius: 3px;
    font-size: 0.92rem;
    font-weight: 500;
    text-decoration: none;
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.2s ease;
    width: 100%;
  }

  .btn-primary {
    background: var(--ember);
    color: #FFFFFF;
  }

  .btn-primary:hover { background: var(--ember-dim); }

  .btn-primary:disabled {
    background: rgba(255, 255, 255, 0.08);
    color: var(--ink-muted);
    cursor: not-allowed;
  }

  .buy-note {
    margin-top: 12px;
    font-size: 0.76rem;
    color: var(--ink-muted);
  }

  .qty-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 18px;
  }

  .qty-row label {
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
  }

  .qty-row input {
    width: 70px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--ink-line);
    color: var(--ink);
    padding: 10px 12px;
    border-radius: 3px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
  }

  .qty-row input:focus { outline: none; border-color: var(--ember); }

  .not-found {
    padding: 100px 0;
    text-align: center;
  }

  .not-found h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 500;
    font-size: 1.8rem;
    margin-bottom: 14px;
    color: var(--ink);
  }

  .not-found p { color: var(--ink-muted); margin-bottom: 24px; }

  /* ---------- Footer ---------- */

  footer {
    border-top: 1px solid var(--ink-line);
    padding: 30px 0;
    position: relative;
  }

  footer .wrap {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.82rem;
    color: var(--ink-muted);
  }

  /* ---------- Responsive ---------- */

  @media (max-width: 900px) {
    nav { display: none; }
    .product { padding: 16px 0 60px; min-height: auto; }
    .product-stage { flex-direction: column; gap: 28px; }
    .stage-visual { min-height: 0; padding-right: 0; }
    .gallery-main { width: min(300px, 80%); transform: rotateX(6deg) rotateY(0deg); }
    .info-panel { position: static; transform: none; width: 100%; margin-top: 0; }
  }
</style>
</head>
<body>

<div class="atelier-bg" aria-hidden="true"></div>

<header>
  <div class="wrap">
    <a href="index.html" class="logo">watch<span>mods</span>.ch</a>
    <div class="header-right">
      <nav>
        <a href="index.html">Accueil</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="configurateur.html">Configurateur</a>
        <a href="index.html#waitlist">Contact</a>
      </nav>
      <a href="panier.html" class="cart-link">Panier <span class="cart-badge" id="cart-badge">0</span></a>
    </div>
  </div>
</header>

<div class="wrap breadcrumb">
  <a href="index.html">Accueil</a> / <a href="catalogue.html">Catalogue</a> / <span id="breadcrumb-nom">…</span>
</div>

<section class="product">
  <div class="wrap" id="product-content"></div>
</section>

<footer>
  <div class="wrap">
    <span>© 2026 watchmods.ch</span>
    <span>Genève, Suisse</span>
  </div>
</footer>

<script>
  // Données statiques temporaires — seront remplacées par une lecture Supabase (table "produits").
  const PHOTO_BASE = 'https://dthpbmiyebbhrtaqcoan.supabase.co/storage/v1/object/public/produits-photos/';
  const produits = [
    { reference: 'WM-101', nom: 'Meridian Émeraude', collection: 'Meridian', prix: 279, stock: 5, photos: [PHOTO_BASE + 'wm-101/01.jpg'],
      description: "Boîtier rond à lunette cannelée, cadran vert sunburst à chiffres arabes, bracelet jubilé acier. Contrôlée à la main avant expédition.",
      boitier: "39mm · acier poli", etancheite: "50m", verre: "Saphir bombé" },
    { reference: 'WM-102', nom: 'Meridian Azur', collection: 'Meridian', prix: 279, stock: 3, photos: [PHOTO_BASE + 'wm-102/01.jpg'],
      description: "Même boîtier Meridian à lunette cannelée, cadran bleu sunburst à chiffres arabes, bracelet jubilé acier.",
      boitier: "39mm · acier poli", etancheite: "50m", verre: "Saphir bombé" },
    { reference: 'WM-103', nom: 'Meridian Rosé', collection: 'Meridian', prix: 319, stock: 2, photos: [],
      description: "Boîtier bi-ton acier et or rose, cadran vert sunburst, bracelet jubilé assorti. Série limitée.",
      boitier: "39mm · acier/or rose", etancheite: "50m", verre: "Saphir bombé" },
    { reference: 'WM-201', nom: 'Aviateur Blanc', collection: 'Aviateur', prix: 259, stock: 6, photos: ['images/produits/wm-201.jpg'], photoAtelier: 'images/produits/wm-201-atelier.jpg',
      description: "Boîtier carré à vis apparentes et couronne cabochon, cadran blanc chiffres romains, aiguilles bleues, bracelet acier.",
      boitier: "40mm · acier brossé", etancheite: "30m", verre: "Saphir plat" },
    { reference: 'WM-202', nom: 'Aviateur Cuir Bleu', collection: 'Aviateur', prix: 249, stock: 4, photos: ['images/produits/wm-202.jpg'],
      description: "Même boîtier Aviateur à vis apparentes, bracelet cuir bleu à surpiqûres et boucle déployante acier.",
      boitier: "40mm · acier brossé", etancheite: "30m", verre: "Saphir plat" },
    { reference: 'WM-301', nom: 'Marina Noire', collection: 'Marina', prix: 289, stock: 5, photos: [PHOTO_BASE + 'wm-301/01.jpg'],
      description: "Boîtier octogonal à bracelet intégré, cadran noir strié horizontal. Une silhouette forte et reconnaissable.",
      boitier: "40mm · acier brossé", etancheite: "60m", verre: "Saphir bombé" },
    { reference: 'WM-302', nom: 'Marina Cuivre', collection: 'Marina', prix: 329, stock: 2, photos: [PHOTO_BASE + 'wm-302/01.jpg'],
      description: "Boîtier octogonal plaqué or rose, cadran brun strié horizontal, bracelet assorti. Série limitée.",
      boitier: "40mm · plaqué or rose", etancheite: "60m", verre: "Saphir bombé" },
    { reference: 'WM-401', nom: 'Globetrotter GMT', collection: 'Globetrotter', prix: 339, stock: 3, photos: [],
      description: "Boîtier rond, lunette bicolore noir/bleu, aiguille GMT dédiée pour un second fuseau horaire, cadran noir, bracelet jubilé acier.",
      boitier: "40mm · acier poli", etancheite: "100m", verre: "Saphir bombé" }
  ];

  const params = new URLSearchParams(window.location.search);
  const ref = params.get('ref');
  const produit = produits.find(p => p.reference === ref);

  const content = document.getElementById('product-content');
  const breadcrumbNom = document.getElementById('breadcrumb-nom');

  if (!produit) {
    breadcrumbNom.textContent = 'Introuvable';
    content.innerHTML = `
      <div class="not-found">
        <h1>Montre introuvable</h1>
        <p>Ce modèle n'existe pas ou n'est plus disponible.</p>
        <a href="catalogue.html" class="btn btn-primary" style="display:inline-flex;width:auto;">Retour au catalogue</a>
      </div>
    `;
  } else {
    document.title = produit.nom + ' — watchmods.ch';
    breadcrumbNom.textContent = produit.nom;

    const enStock = produit.stock > 0;
    const heroPhoto = produit.photoAtelier || (produit.photos && produit.photos[0]);
    const gallery = heroPhoto
      ? `<div class="gallery-main"><img src="${heroPhoto}" alt="${produit.nom}"></div>`
      : `<div class="gallery-main"><div class="hand"></div><div class="hand"></div></div>`;

    content.innerHTML = `
      <div class="product-stage reveal">
        <div class="stage-visual">
          <div class="stage-visual-glow" aria-hidden="true"></div>
          ${gallery}
        </div>
        <div class="info-panel">
          <div class="info-collection">${produit.collection}</div>
          <h1>${produit.nom}</h1>
          <div class="info-ref mono">Référence ${produit.reference}</div>
          <div class="info-price">CHF ${produit.prix}</div>
          <div class="stock-line ${enStock ? 'ok' : 'rupture'}">${enStock ? `En stock — ${produit.stock} disponible(s)` : 'Rupture de stock'}</div>
          <p class="info-desc">${produit.description}</p>
          <div class="spec-card">
            <div class="spec-row"><span class="label">Boîtier</span><span class="value">${produit.boitier}</span></div>
            <div class="spec-row"><span class="label">Étanchéité</span><span class="value">${produit.etancheite}</span></div>
            <div class="spec-row"><span class="label">Verre</span><span class="value">${produit.verre}</span></div>
            <div class="spec-row"><span class="label">Contrôle qualité</span><span class="value">Manuel</span></div>
          </div>
          ${enStock ? `
          <div class="qty-row">
            <label for="qty-input" class="mono">Quantité</label>
            <input type="number" id="qty-input" min="1" max="${produit.stock}" value="1">
          </div>
          ` : ''}
          <button class="btn btn-primary" id="add-cart-btn" ${enStock ? '' : 'disabled'}>
            ${enStock ? 'Ajouter au panier' : 'Rupture de stock'}
          </button>
          <div class="buy-note" id="add-confirm" style="display:none;">Ajouté au panier ✓ — <a href="panier.html" style="color:var(--ember);">voir mon panier</a></div>
          <div class="buy-note" id="buy-note-default">Paiement sécurisé par Stripe, expédition rapide.</div>
        </div>
      </div>
    `;

    const addCartBtn = document.getElementById('add-cart-btn');
    if (addCartBtn && enStock) {
      addCartBtn.addEventListener('click', () => {
        const qtyInput = document.getElementById('qty-input');
        const quantiteVoulue = Math.max(1, Math.min(produit.stock, parseInt(qtyInput.value, 10) || 1));

        let cart = [];
        try { cart = JSON.parse(localStorage.getItem('watchmods_cart') || '[]'); } catch (e) {}

        const existant = cart.find(item => item.reference === produit.reference);
        if (existant) {
          existant.quantite = Math.min(produit.stock, existant.quantite + quantiteVoulue);
        } else {
          cart.push({ reference: produit.reference, nom: produit.nom, prix: produit.prix, quantite: quantiteVoulue });
        }
        localStorage.setItem('watchmods_cart', JSON.stringify(cart));
        window.dispatchEvent(new Event('storage'));

        var confirmEl = document.getElementById('add-confirm');
        confirmEl.style.display = 'block';
        confirmEl.classList.add('pop-in');
        document.getElementById('buy-note-default').style.display = 'none';
        addCartBtn.classList.add('pop-in');
        addCartBtn.addEventListener('animationend', function () { addCartBtn.classList.remove('pop-in'); }, { once: true });
      });
    }

    // Effet 3D : la montre suit légèrement le curseur (désactivé sans souris / mouvement réduit).
    var stage = document.querySelector('.stage-visual');
    var galleryEl = document.querySelector('.gallery-main');
    var canHover = window.matchMedia('(hover: hover)').matches;
    var reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (stage && galleryEl && canHover && !reducedMotion) {
      stage.addEventListener('mousemove', function (e) {
        var rect = stage.getBoundingClientRect();
        var px = (e.clientX - rect.left) / rect.width - 0.5;
        var py = (e.clientY - rect.top) / rect.height - 0.5;
        galleryEl.style.transform = 'rotateX(' + (8 - py * 16) + 'deg) rotateY(' + (-14 + px * 24) + 'deg)';
      });
      stage.addEventListener('mouseleave', function () {
        galleryEl.style.transform = 'rotateX(8deg) rotateY(-14deg)';
      });
    }
  }

  (function () {
    var badge = document.getElementById('cart-badge');
    function updateCartBadge() {
      var cart = [];
      try { cart = JSON.parse(localStorage.getItem('watchmods_cart') || '[]'); } catch (e) {}
      var count = cart.reduce(function (sum, item) { return sum + (item.quantite || 1); }, 0);
      if (!badge) return;
      badge.textContent = count;
      badge.style.display = count > 0 ? 'inline-flex' : 'none';
    }
    updateCartBadge();
    window.addEventListener('storage', updateCartBadge);
  })();

  (function () {
    var header = document.querySelector('header');
    function onScroll() { if (header) header.classList.toggle('scrolled', window.scrollY > 8); }
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
  })();
</script>
